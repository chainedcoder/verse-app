name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Set up Database
      env:
        DATABASE_URL: "mysql://root:root@127.0.0.1:3306/test_db?allowPublicKeyRetrieval=true"
      run: |
        npx prisma db push
        npx prisma generate
        
    - name: Lint
      run: npm run lint
      
    - name: Run Unit Tests
      env:
        DATABASE_URL: "mysql://root:root@127.0.0.1:3306/test_db?allowPublicKeyRetrieval=true"
      run: npx jest
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run E2E Tests
      env:
        DATABASE_URL: "mysql://root:root@127.0.0.1:3306/test_db?allowPublicKeyRetrieval=true"
      run: npx playwright test